# П. 4 задания: сетка (η, ρ) для L2-регуляризации.
# Диапазоны выбраны по пилоту и калибровке углов сетки (docs/PILOT_RESULTS.md):
# при η = 1e-3...4e-3 и ρ = 3e-6...3e-4 переход наступает до ~2000-й эпохи.
#
# Одно задание = одно η; внутри — 6 значений ρ x 6 seed = 36 реплик.
# ρ = 0 — контроль без регуляризации; считается только здесь (в grid_l1.yaml его нет).

base: base.yaml

experiment:
  name: grid_l2

overrides:
  regularization.kind: l2
  # training.epochs = 6000 из base.yaml, как и в grid_l1.yaml: одинаковый горизонт нужен,
  # чтобы end_test_acc и цензурирование t_gen95 были сравнимы для L1 и L2.

grid:
  jobs_over:
    optimizer.lr: [1.0e-3, 2.0e-3, 4.0e-3]
  replicas_over:
    regularization.rho: [0.0, 3.0e-6, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4]
