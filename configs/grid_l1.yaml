# П. 4 задания: сетка (η, ρ) для L1-регуляризации.
# Диапазоны выбраны по пилоту и калибровке углов сетки (docs/PILOT_RESULTS.md):
# при ρ = 3e-7...3e-5 скачок test_acc есть, но обобщение обычно неполное.
#
# Одно задание = одно η; внутри — 5 значений ρ x 6 seed = 30 реплик.
# Контроль ρ = 0 общий с L2 и считается в grid_l2.yaml.

base: base.yaml

experiment:
  name: grid_l1

overrides:
  regularization.kind: l1

grid:
  jobs_over:
    optimizer.lr: [1.0e-3, 2.0e-3, 4.0e-3]
  replicas_over:
    regularization.rho: [3.0e-7, 1.0e-6, 3.0e-6, 1.0e-5, 3.0e-5]
