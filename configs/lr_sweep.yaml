# П. 2 задания: подбор η, при котором grokking проявляется ярко.
# Всё, что не перечислено ниже, берётся из base.yaml (6000 эпох).
#
# Семантика сетки (реализует src/grokking/config.py):
#   grid.jobs_over     — декартово произведение значений -> отдельные задания (процессы);
#   grid.replicas_over — декартово произведение значений x seeds -> реплики внутри задания
#                        (допустимо только для полей, которые могут различаться у реплик: rho).
# Диапазон η взят шире сетки п. 4 в обе стороны, чтобы было видно, где эффект пропадает.

base: base.yaml

experiment:
  name: lr_sweep

overrides:
  regularization.kind: l2
  regularization.rho: 1.0e-4

grid:
  jobs_over:
    optimizer.lr: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2, 3.0e-2]
  replicas_over: {}

replicas:
  seeds: [0, 1]
