experiment_name: lr_sweep
output_root: results
data:
  q: 97
  train_frac: 0.4
  split_seed: 0
model:
  d_hidden: 256
  n_hidden_layers: 1
  activation: relu
optimizer:
  name: adam
  lr: 0.03
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-08
regularization:
  kind: l2
  rho:
  - 0.0001
  - 0.0001
  apply_to: weights
epochs: 6000
dtype: float32
eval_every: 10
checkpoint_steps: []
seeds:
- 0
- 1
device: auto
deterministic: true
threads: 4
